---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@localhost"
      - name: Install lefthook remotes
        run: TERM=dumb nix develop --ignore-environment --keep TERM .#ci --command lefthook install
      - name: Pre-commit checks
        run: TERM=dumb nix develop --ignore-environment --keep TERM --keep HOME .#ci --command bash -c 'mkdir -p "$HOME/.parallel" && touch "$HOME/.parallel/will-cite"; lefthook run pre-commit --all-files'
      - name: Pre-push checks
        run: TERM=dumb nix develop --ignore-environment --keep TERM --keep HOME .#ci --command bash -c 'mkdir -p "$HOME/.parallel" && touch "$HOME/.parallel/will-cite"; LEFTHOOK_BATS_CHANGED_TIMEOUT=300 lefthook run pre-push --all-files'

  lint-macos:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@localhost"
      - name: Install lefthook remotes
        run: TERM=dumb nix develop --ignore-environment --keep TERM .#ci --command lefthook install
      - name: Pre-commit checks
        run: TERM=dumb nix develop --ignore-environment --keep TERM --keep HOME .#ci --command bash -c 'mkdir -p "$HOME/.parallel" && touch "$HOME/.parallel/will-cite"; lefthook run pre-commit --all-files'
      - name: Pre-push checks
        run: TERM=dumb nix develop --ignore-environment --keep TERM --keep HOME .#ci --command bash -c 'mkdir -p "$HOME/.parallel" && touch "$HOME/.parallel/will-cite"; LEFTHOOK_BATS_CHANGED_TIMEOUT=300 lefthook run pre-push --all-files'
